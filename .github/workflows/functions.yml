name: Deploy Central Functions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: central-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: central-functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: node scripts/verify-runtime-source.mjs
      - name: Check schema and deploy functions
        run: node scripts/deploy-functions.mjs --apply
        env:
          CENTRAL_PROJECT_REF: ${{ vars.CENTRAL_PROJECT_REF }}
          CENTRAL_ORIGIN: ${{ vars.CENTRAL_ORIGIN }}
          CENTRAL_PAGE_URL: ${{ vars.CENTRAL_PAGE_URL }}
          CENTRAL_TOKEN_SECRET: ${{ secrets.CENTRAL_TOKEN_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
